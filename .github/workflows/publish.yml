name: Publish to npm

# The npm trusted publisher of @wiro-ai/wiro-agent-connectors is this
# repository and this file (.github/workflows/publish.yml), with no
# environment. Keep the file name as it is and add no environment, or
# publishing stops working.
#
# npm gets only commits that are on main: a release whose tag points anywhere
# else publishes nothing. A prerelease goes to the dist-tag next, never latest.
#
# Wiro-MCP's workflow also publishes to the MCP Registry and Docker Hub. Those
# steps are left out here for now.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # The whole history, so the next step can tell whether the release
      # commit is on main.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before anything is installed: the commit the release tag points to must
      # be main's tip or one of its ancestors, never a commit of another branch.
      - name: Check the release commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The release tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main: merge the change into main, then release a commit of main."
            exit 1
          fi
          echo "The release commit $GITHUB_SHA is on main."

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm publishes the version in package.json, so the release tag must be v<that version>.
      - name: Check the release tag matches package.json
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const version = require("./package.json").version;
            if (tag !== `v${version}`) {
              console.error(`::error::The release tag is ${tag}, but package.json says ${version}: tag the release v${version}.`);
              process.exit(1);
            }
          '

      # latest is what `npm install` and `npx` get, so a prerelease goes to next:
      # a release marked as a pre-release on GitHub, or a version with a "-",
      # such as 0.3.0-rc.1. Every other release becomes latest.
      - name: Choose the npm dist-tag
        id: dist-tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "$PRERELEASE" = "true" ] || [[ "$version" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi
          echo "npm gets $version with the dist-tag $tag."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # There is no npm token: npm signs this workflow in through OIDC.
      # npm refuses to publish while package.json says "private": true.
      - name: Publish with provenance
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
