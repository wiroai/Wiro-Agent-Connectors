name: Publish to npm

# The npm trusted publisher of @wiro-ai/wiro-agent-connectors is this
# repository and this file (.github/workflows/publish.yml), with no
# environment. Keep the file name as it is, or publishing stops working.
#
# Wiro-MCP's workflow also publishes to the MCP Registry and Docker Hub. Those
# steps are left out here for now.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm publishes the version in package.json, so the release tag must be v<that version>.
      - name: Check the release tag matches package.json
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const version = require("./package.json").version;
            if (tag !== `v${version}`) {
              console.error(`::error::The release tag is ${tag}, but package.json says ${version}: tag the release v${version}.`);
              process.exit(1);
            }
          '

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # There is no npm token: npm signs this workflow in through OIDC.
      # npm refuses to publish while package.json says "private": true.
      - name: Publish with provenance
        run: npm publish --provenance --access public
